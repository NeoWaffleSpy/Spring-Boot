// Settings shared by every module. IntelliJ 2022.2 runs on Java 17, so everything targets 17.
subprojects {
    apply plugin: 'java'

    group = 'com.eventmapper'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
}
