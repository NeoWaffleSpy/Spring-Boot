// Plain Java: no IDE classes allowed here, so the Eclipse plugin and a command-line
// version can reuse it as is.
plugins {
    id 'java-library'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
